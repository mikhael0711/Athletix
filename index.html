<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>ATHLETIX — Suivi sportif</title>
<style>
:root{--bg:#090e1b;--panel:#131d30;--panel2:#1b2940;--line:#293750;--txt:#f4f7ff;--muted:#9cabc4;--teal:#31d6be;--purple:#a998ff;--orange:#ffbd67}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17243b 0,#090e1b 48%);color:var(--txt);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.app{max-width:1050px;margin:auto;padding:20px 18px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:900;letter-spacing:2px;font-size:23px}.brand span{color:var(--teal)}.tag{color:var(--muted);font-size:11px;letter-spacing:2px;margin-top:3px}.pill{border:1px solid #27594f;color:var(--teal);padding:7px 11px;border-radius:30px;font-size:11px}.welcome h1{font-size:30px;margin:4px 0}.muted{color:var(--muted)}.small{font-size:12px}.tabs{display:flex;gap:7px;overflow:auto;padding:12px 0 17px;position:sticky;top:0;background:#0b1020ee;z-index:5;backdrop-filter:blur(12px)}button,select,input,textarea{font:inherit}.tab,.btn,.ghost{border:0;border-radius:12px;padding:11px 14px;background:var(--panel2);color:var(--txt);cursor:pointer;white-space:nowrap}.tab.active,.btn{background:linear-gradient(120deg,#18a995,#277fba);color:#06151b;font-weight:750}.ghost{border:1px solid var(--line);background:transparent;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:linear-gradient(145deg,#17243a,#111a2b);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:13px;box-shadow:0 12px 30px #0002}.metric{font-size:27px;font-weight:800;margin:7px 0}.label{font-size:12px;color:var(--muted)}h2{font-size:19px;margin:0 0 14px}h3{font-size:15px;margin:0 0 7px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin:9px 0}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;background:#0c1525;color:var(--txt);border:1px solid #34445f;border-radius:10px;padding:11px;min-width:0}textarea{min-height:70px}.exercise{border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0;background:#0e1829}.exercise a{color:var(--teal);font-size:12px}.chip{font-size:11px;color:var(--teal);background:#123b3a;padding:5px 8px;border-radius:20px}.bar{height:8px;background:#26344b;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#6b9cff);border-radius:9px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{flex:1}.hidden{display:none}.statline{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #253149}.setrow{display:grid;grid-template-columns:42px 1fr 1fr 1fr 34px;gap:6px;align-items:center;margin:7px 0}.setrow input{padding:9px}.setrow button{background:#472c3b;color:#ffb4c7;border:0;border-radius:8px;padding:8px}.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:25px}.chart{width:100%;height:180px;background:#0e1829;border-radius:14px;padding:10px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1e514b;color:#d9fff6;padding:11px 18px;border-radius:30px;display:none;z-index:10}@media(max-width:700px){.app{padding:15px 13px 95px}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.tabs{margin:0 -13px;padding:10px 13px}.tab{padding:10px}.welcome h1{font-size:25px}.setrow{grid-template-columns:25px 1fr 1fr 1fr 30px}.setrow input{padding:8px 5px;font-size:13px}}
</style></head><body><div class="app">
<header class="top"><div><div class="brand">ATHLE<span>TIX</span></div><div class="tag">TRAIN · TRACK · IMPROVE</div></div><div class="pill">PROTO V1 · LOCAL</div></header>
<div class="welcome"><div class="muted small" id="today"></div><h1>Ton espace sportif.</h1><div class="muted">Toutes tes données d'entraînement au même endroit.</div></div>
<nav class="tabs" id="tabs"></nav><main id="main"></main><div class="foot">ATHLETIX · Prototype local · Tes données restent sur cet appareil. Pense à exporter régulièrement une sauvegarde.</div></div><div class="toast" id="toast"></div>
<script>
const PLANS=[{"name": "PULL 1", "exercises": [{"name": "Tirage vertical poulie haute prise neutre", "sets": 3, "reps": "2 x 6-10 / 1 x 12-16", "notes": "Focus grand dorsal. Coudes le long du corps.", "video": "https://youtu.be/CMpULcny4xs", "setup": "", "last": "Tirage vertical poulie haute prise neutre"}, {"name": "Chest supported row", "sets": 3, "reps": "2 x 6-10 / 1 x 12-16", "notes": "Prise pronation. Coudes ouverts", "video": "https://youtu.be/SIlHZZ-ndbA", "setup": "5 au buste ", "last": "Chest supported row"}, {"name": "Tirage horizontal neutre poulie basse", "sets": 3, "reps": "3 x 8-12", "notes": "Prise largeur d'épaules.", "video": "https://www.youtube.com/watch?v=dYDI15OG9mA&ab_channel=Fit-Mass", "setup": "", "last": "Tirage horizontal neutre poulie basse"}, {"name": "Arriere d'épaule à la poulie", "sets": 3, "reps": "3 x 10-16", "notes": "Focus exécution du mouvement.", "video": "https://youtu.be/-s9gfhw-v4A", "setup": "", "last": "Arriere d'épaule à la poulie"}, {"name": "Curl marteau haltères", "sets": 3, "reps": "3 x 8-12", "notes": "", "video": "https://www.youtube.com/shorts/XtruE8T-19Q", "setup": "", "last": "Curl marteau haltères"}, {"name": "Curl barre", "sets": 3, "reps": "3 x 8-12", "notes": "Avec barre EZ si douleurs aux poignets", "video": "https://www.youtube.com/shorts/-BQQSYnhfl0", "setup": "", "last": "Curl barre"}]}, {"name": "PUSH 1", "exercises": [{"name": "Elevation latérale haltères", "sets": 3, "reps": "3 x 10-16", "notes": "Focus exécution du mouvement", "video": "https://youtube.com/shorts/67aqcWUYw2I?feature=share", "setup": "", "last": "12x12 - 16x12 - 16x10"}, {"name": "Développé incliné aux haltères", "sets": 3, "reps": "2 x 6-10 / 1 x 12-16", "notes": "Banc à 30°. Coudes à 45° par rapport au buste.", "video": "https://www.youtube.com/watch?v=Fv5EYoJfRt4", "setup": "", "last": "10x30 - 10x30 - 16x30"}, {"name": "Chest press convergente couchée", "sets": 3, "reps": "2 x 6-10 / 1 x 12-16", "notes": "Prise neutre", "video": "https://youtu.be/e9EI9ldYGwQ", "setup": "", "last": "10x140 - 10x140 - 14x140"}, {"name": "Dips", "sets": 3, "reps": "3 x 5-9", "notes": "", "video": "https://youtu.be/n1bgBXpTW5s", "setup": "", "last": "9x77 - 10x86 - 10x86"}, {"name": "Ecarté à la machine", "sets": 3, "reps": "3 x 10-16", "notes": "Focus rapprochement des coudes", "video": "https://www.youtube.com/shorts/REztw3a8ALU", "setup": "", "last": "16x120 - 16x120 - 16x120 revenir à 113"}, {"name": "Extension triceps à la poulie", "sets": 3, "reps": "3 x 8-12", "notes": "Double corde", "video": "https://youtube.com/shorts/WPz428DzDCk?feature=share", "setup": "", "last": "12x22,5 - 12x22,5 - 12x22,5"}]}, {"name": "LEGS 1", "exercises": [{"name": "Extension mollets smith machine", "sets": 3, "reps": "3 x 8-12", "notes": "Pause en bas et en haut du mouvement - 2sec", "video": "https://youtu.be/OnnEk48CJ9Y", "setup": "", "last": "12x70 - 12x70 - 12x70"}, {"name": "Leg curl assis", "sets": 3, "reps": "3 x 10-14", "notes": "", "video": "https://youtu.be/Ho7pbpwDdNA", "setup": "dos 6 - tibia 3 - cuisses 1", "last": "14x73 - 14x79 - 14x79"}, {"name": "Presse à cuisses inclinée", "sets": 3, "reps": "2 x 6-10 / 1 x 12-16", "notes": "Pieds en bas de plateau", "video": "https://youtu.be/A_GfCsM8904", "setup": "", "last": "10x160 - 10x160 - 16x160"}, {"name": "Leg extension", "sets": 3, "reps": "3 x 8-12", "notes": "Avec élastique", "video": "https://youtu.be/QGnTTG-5ex0", "setup": "3- 3 - 2 // dos 6 - jambe 1", "last": "12x73 - 12x73 - 12x73"}, {"name": "Sissy Squat", "sets": 3, "reps": "3 x AMRAP", "notes": "", "video": "https://youtu.be/FTmbNjUu7CI", "setup": "", "last": "15 - 15 - 15"}, {"name": "Crunch poulie haute", "sets": 3, "reps": "3 x 8-12", "notes": "Focus flexion/extension de la colonne", "video": "https://youtu.be/_ZWASnldZ6U", "setup": "", "last": "12x40 - 12x40 - 12x40"}]}, {"name": "PULL 2", "exercises": [{"name": "Tirage vertical poulie haute", "sets": 3, "reps": "2 x 6-10 / 1 x 12-16", "notes": "Prise pronation. ", "video": "https://www.youtube.com/watch?v=G6-dsnJZh9s&ab_channel=Willteam", "setup": "", "last": "10x66 - 10x66 - 16x66"}, {"name": "Chest supported row machine PRISE PRONATION", "sets": 3, "reps": "2 x 6-10 / 1 x 12-16", "notes": "Prise pronation. Coudes ouverts", "video": "https://store.soolis.com/media/catalog/product/cache/10/image/0dc2d03fe217f8c83829496872af24a0/g/3/g3s34_diverging_row.jpg", "setup": "4", "last": ""}, {"name": "Chest supported row haltères", "sets": 3, "reps": "3 x 8-12", "notes": "Coudes ouverts", "video": "https://youtu.be/DIS839guYUk", "setup": "", "last": "12x26 - 12x26 - 12x26"}, {"name": "Chest supported row machine PRISE NEUTRE", "sets": 3, "reps": "3 x 8-12", "notes": "Focus grand dorsal. Coudes le long du corps.", "video": "https://store.soolis.com/media/catalog/product/cache/10/image/0dc2d03fe217f8c83829496872af24a0/g/3/g3s34_diverging_row.jpg", "setup": "", "last": "12x86 - 12x86 - 12x86"}, {"name": "Elevation postérieure haltères", "sets": 3, "reps": "3 x 10-16", "notes": "Avec appuie sur banc si besoin ", "video": "https://www.youtube.com/watch?v=_qqkXMMe6AY", "setup": "", "last": "16x20 - 16x20 - 16x20"}, {"name": "Curl marteau poulie", "sets": 3, "reps": "3 x 8-12", "notes": "Prise neutre avec une corde.", "video": "https://www.youtube.com/watch?v=GzZ9Msg-Lyc", "setup": "", "last": "12x27- 12x27 - 12x27"}, {"name": "Curl haltères", "sets": 3, "reps": "3 x 8-12", "notes": "Curl haltères ", "video": "https://youtu.be/HnHuhf4hEWY", "setup": "", "last": "12x18 - 12x18 - 12x18 2 min"}]}, {"name": "PUSH 2", "exercises": [{"name": "Elevation Y haltères", "sets": 3, "reps": "3 x 10-16", "notes": "", "video": "https://youtu.be/sDOqMsWsm8c", "setup": "banc à 45", "last": "16x12 - 16x12 - 16x12"}, {"name": "Elevation latérale sur banc incliné", "sets": 3, "reps": "3 x 10-16", "notes": "", "video": "https://youtube.com/shorts/3SKhMeCwVhM", "setup": "banc à 30", "last": "16x12 - 16x12 - 16x12"}, {"name": "Développé incliné smith machine", "sets": 3, "reps": "2 x 6-10 / 1 x 12-16", "notes": "Banc à 30°", "video": "https://youtube.com/shorts/sHh1BivVH6k?feature=share", "setup": "", "last": "10x60 - 10x60 - 16x60"}, {"name": "Shoulder press pin loaded", "sets": 3, "reps": "2 x 6-10 / 1 x 12-16", "notes": " Prise neutre", "video": "https://youtu.be/oJZ8iY4qvh0", "setup": "", "last": "10x59 - 10x59 - 16x59"}, {"name": "Chest press convergente", "sets": 3, "reps": "2 x 6-10 / 1 x 12-16", "notes": "Prise neutre", "video": "https://youtube.com/shorts/9AtopDKQ4Rs?feature=share", "setup": "chest supported row", "last": "10x79 - 10x79 - 16x79"}, {"name": "Ecarté à la poulie haute", "sets": 3, "reps": "3 x 10-16", "notes": "Focus rapprochement des coudes", "video": "https://youtu.be/_Mc5S9t1Hpc", "setup": "", "last": "16x15,8 - 16x15,8 - 16x18"}, {"name": "Extension nuque poulie haute", "sets": 3, "reps": "3 x 8-12", "notes": "Double corde si besoin", "video": "https://youtube.com/shorts/6CWDvdrN5Ww?feature=share", "setup": "", "last": "12x27 - 12x27 - 12x27 "}]}, {"name": "LEGS 2", "exercises": [{"name": "Extension mollets à la presse a cuisse horizontale", "sets": 3, "reps": "3 x 10-16", "notes": "Pause lors de l'étirement et la contraction + contrôle de la négative", "video": "https://youtube.com/shorts/IgOkw_1P2OM?feature=share", "setup": "6", "last": "16x120 - 16x120 - 16x120"}, {"name": "Leg curl couché", "sets": 3, "reps": "3 x 8-12", "notes": "Focus contrôle de la négative", "video": "https://youtu.be/jZjujV8V8Mk", "setup": "0 fesses - 3 mollets", "last": "12x54 - 12x54 - 12x54"}, {"name": "Soulevé de terre roumain", "sets": 3, "reps": "2 x 6-10 / 1 x 12-16", "notes": "Focus contrôle du mouvement", "video": "https://youtu.be/nJPIcrhy6uY ", "setup": "", "last": "10x80 - 10x80 - 16x80"}, {"name": "Presse à cuisses horizontale", "sets": 3, "reps": "2 x 6-10 / 1 x 12-16", "notes": "Pieds bas sur la plateforme.", "video": "https://youtu.be/q5X8r0eURaM", "setup": "6", "last": "10x120 - 10x120 - 16x120"}, {"name": "Adducteur machine", "sets": 3, "reps": "3 x 10-16", "notes": "", "video": "https://youtu.be/InRzFJ22J_M", "setup": "3", "last": "16x79 - 16x79 - 16x79"}, {"name": "Relevé de jambes suspendu", "sets": 3, "reps": "3 x AMRAP", "notes": "AMRAP : Max de rep", "video": "https://youtube.com/shorts/qPXgrgUrIsg?feature=share", "setup": "", "last": "20 - 20 - 20"}]}];
const KEY='athletix_v1_store';
let store=JSON.parse(localStorage.getItem(KEY)||'{"sessions":[],"body":[],"plans":null}');
if(!store.plans)store.plans=PLANS;
let current='Accueil',activePlan=0,sessionDraft=null;
const tabs=['Accueil','Corps','Bibliothèque','Programmes','Séance du jour','Progression','Données'];
const $=s=>document.querySelector(s);
function save(){localStorage.setItem(KEY,JSON.stringify(store));}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2400)}
function nav(){ $('#tabs').innerHTML=tabs.map(t=>`<button class="tab ${current===t?'active':''}" onclick="go('${t}')">${t==='Séance du jour'?'＋ Séance':t}</button>`).join('');}
function go(t){current=t;render()}
function fmt(d){return new Date(d).toLocaleDateString('fr-FR')}
function render(){nav();$('#today').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});let m=$('#main');m.innerHTML='';
if(current==='Accueil')home(m);if(current==='Corps')body(m);if(current==='Bibliothèque')library(m);if(current==='Programmes')programs(m);if(current==='Séance du jour')training(m);if(current==='Progression')progress(m);if(current==='Données')dataPage(m);}
function card(title,inner){return `<section class="card"><h2>${title}</h2>${inner}</section>`}
function home(m){let recent=store.sessions.slice(-7),bodyLast=store.body.at(-1);m.innerHTML=`
<div class="grid">
<div class="card"><div class="label">Séances enregistrées</div><div class="metric">${store.sessions.length}</div><div class="label">Depuis le début</div></div>
<div class="card"><div class="label">Programmes</div><div class="metric">${store.plans.length}</div><div class="label">Importés de ton Excel</div></div>
<div class="card"><div class="label">Poids récent</div><div class="metric">${bodyLast?bodyLast.weight+' kg':'—'}</div><div class="label">Dernière mesure</div></div>
<div class="card"><div class="label">Running</div><div class="metric">${store.sessions.filter(s=>s.type==='running').length}</div><div class="label">Sorties enregistrées</div></div></div>
${card('Démarrage rapide',`<div class="two"><button class="btn" onclick="go('Séance du jour')">＋ Enregistrer une séance</button><button class="ghost" onclick="go('Corps')">＋ Ajouter une mesure corporelle</button></div>`)}
${card('Dernières séances',recent.length?recent.slice().reverse().map(s=>`<div class="statline"><span>${esc(s.name)} <span class="muted small">· ${fmt(s.date)}</span></span><b>${s.type==='running'?esc(s.distance)+' km':(s.exercises||[]).length+' ex.'}</b></div>`).join(''):'<p class="muted">Aucune séance enregistrée pour le moment. Tes nouvelles séances apparaîtront ici.</p>')}
${card('Tes programmes importés',store.plans.map((p,i)=>`<div class="statline"><span>${esc(p.name)}</span><span class="muted">${p.exercises.length} exercices</span></div>`).join(''))}`}
function body(m){let last=store.body.at(-1);m.innerHTML=card('Nouvelle mesure corporelle',`<div class="two"><div class="field"><label>Date</label><input id="bdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Poids (kg)</label><input id="weight" type="number" step=".1" placeholder="72.4"></div><div class="field"><label>Masse grasse (%)</label><input id="fat" type="number" step=".1" placeholder="14.8"></div><div class="field"><label>Masse musculaire (kg)</label><input id="muscle" type="number" step=".1" placeholder="57.1"></div><div class="field"><label>IMC</label><input id="bmi" type="number" step=".1"></div><div class="field"><label>Eau corporelle (%)</label><input id="water" type="number" step=".1"></div><div class="field"><label>Masse osseuse (kg)</label><input id="bone" type="number" step=".1"></div><div class="field"><label>Graisse viscérale</label><input id="visceral" type="number" step=".1"></div></div><div class="field"><label>Notes</label><textarea id="bnotes" placeholder="Contexte, heure de mesure…"></textarea></div><button class="btn" onclick="addBody()">Enregistrer la mesure</button>`) + card('Historique',store.body.length?store.body.slice().reverse().map(b=>`<div class="statline"><span>${fmt(b.date)}</span><b>${b.weight||'—'} kg</b><span class="muted small">MG ${b.fat||'—'} % · Muscle ${b.muscle||'—'} kg</span></div>`).join(''):'<p class="muted">Ajoute ta première mesure pour démarrer le suivi.</p>')+`<p class="muted small">Les valeurs de composition corporelle issues d'une balance à impédancemétrie sont des estimations. Compare surtout les tendances dans des conditions de mesure similaires.</p>`}
function addBody(){let o={date:$('#bdate').value,weight:$('#weight').value,fat:$('#fat').value,muscle:$('#muscle').value,bmi:$('#bmi').value,water:$('#water').value,bone:$('#bone').value,visceral:$('#visceral').value,notes:$('#bnotes').value};if(!o.weight&&!o.fat&&!o.muscle){toast('Renseigne au moins un indicateur');return}store.body.push(o);save();toast('Mesure enregistrée');render()}
function library(m){let all=[...new Map(store.plans.flatMap(p=>p.exercises).map(e=>[e.name,e])).values()];m.innerHTML=card('Bibliothèque',`<div class="field"><label>Rechercher un exercice</label><input id="search" placeholder="Ex. développé couché" oninput="filterExercises()"></div><div id="exlist">${all.map(exCard).join('')}</div>`)}
function exCard(e){return `<article class="exercise"><div class="row"><b>${esc(e.name)}</b><span class="chip">${e.sets||3} séries</span></div><div class="muted small">${esc(e.reps||'Fourchette à préciser')}</div>${e.notes?`<p class="small">${esc(e.notes)}</p>`:''}${e.setup?`<div class="muted small">Réglage : ${esc(e.setup)}</div>`:''}${e.video&&e.video.startsWith('http')?`<a href="${esc(e.video.trim())}" target="_blank" rel="noopener">▶ Voir la vidéo explicative</a>`:''}</article>`}
function filterExercises(){let q=$('#search').value.toLowerCase();let all=[...new Map(store.plans.flatMap(p=>p.exercises).map(e=>[e.name,e])).values()].filter(e=>(e.name+' '+e.notes).toLowerCase().includes(q));$('#exlist').innerHTML=all.map(exCard).join('')||'<p class="muted">Aucun exercice trouvé.</p>'}
function programs(m){m.innerHTML=card('Tes six programmes',store.plans.map((p,i)=>`<div class="exercise"><div class="row"><h3>${esc(p.name)}</h3><span class="chip">${p.exercises.length} exercices</span></div><div class="muted small">${p.exercises.slice(0,3).map(e=>esc(e.name)).join(' · ')}${p.exercises.length>3?' …':''}</div><div class="nav" style="margin-top:10px"><button class="btn" onclick="startPlan(${i})">Démarrer cette séance</button><button class="ghost" onclick="showPlan(${i})">Détails</button></div></div>`).join('')+`<p class="muted small">Les programmes sont préremplis depuis le LOGBOOK de ton classeur. Tu pourras les modifier dans une version ultérieure.</p>`)}
function showPlan(i){let p=store.plans[i];alert(p.name+'\\n\\n'+p.exercises.map(e=>`${e.name} — ${e.sets} séries — ${e.reps}`).join('\\n'))}
function startPlan(i){activePlan=i;sessionDraft={type:'strength',name:store.plans[i].name,exercises:store.plans[i].exercises.map(e=>({...e,setsData:Array.from({length:Number(e.sets)||3},()=>({reps:'',weight:''}))}))};go('Séance du jour')}
function training(m){if(!sessionDraft)sessionDraft={type:'strength',name:'Séance libre',exercises:[]};m.innerHTML=card('Enregistrer une séance',`<div class="field"><label>Type</label><select id="stype" onchange="switchType(this.value)"><option value="strength" ${sessionDraft.type==='strength'?'selected':''}>Musculation</option><option value="running" ${sessionDraft.type==='running'?'selected':''}>Running</option></select></div><div class="field"><label>Nom de la séance</label><input id="sname" value="${esc(sessionDraft.name)}"></div><div id="strengthFields" class="${sessionDraft.type==='running'?'hidden':''}"><div class="field"><label>Ajouter un exercice (depuis tes programmes)</label><select id="addex"><option value="">Choisir un exercice…</option>${[...new Map(store.plans.flatMap(p=>p.exercises).map(e=>[e.name,e])).values()].map(e=>`<option>${esc(e.name)}</option>`).join('')}</select></div><button class="ghost" onclick="addExercise()">Ajouter l'exercice</button><div id="workoutExercises">${(sessionDraft.exercises||[]).map((e,i)=>exerciseEditor(e,i)).join('')}</div></div><div id="runFields" class="${sessionDraft.type==='running'?'':'hidden'}"><div class="two"><div class="field"><label>Distance (km)</label><input id="distance" type="number" step=".01" placeholder="5.00"></div><div class="field"><label>Durée (min)</label><input id="duration" type="number" step=".1" placeholder="30"></div><div class="field"><label>Fréquence cardiaque moyenne</label><input id="hr" type="number" placeholder="150"></div><div class="field"><label>Dénivelé positif (m)</label><input id="elev" type="number" placeholder="80"></div></div><div class="field"><label>Ressenti</label><select id="feel"><option>Très difficile</option><option>Difficile</option><option selected>Correct</option><option>Bon</option><option>Excellent</option></select></div></div><div class="field"><label>Notes / sensations</label><textarea id="snotes" placeholder="Énergie, douleurs, sommeil, remarques…"></textarea></div><button class="btn" onclick="saveSession()">Enregistrer la séance</button>`)}
function exerciseEditor(e,i){return `<div class="exercise" data-ex="${i}"><div class="row"><b>${esc(e.name)}</b><button class="ghost" onclick="removeExercise(${i})">Retirer</button></div><div class="muted small">${esc(e.reps||'')}</div>${(e.setsData||[]).map((s,j)=>`<div class="setrow"><span class="muted small">S${j+1}</span><input placeholder="kg" type="number" step=".1" value="${esc(s.weight)}" onchange="draftSet(${i},${j},'weight',this.value)"><input placeholder="reps" type="number" value="${esc(s.reps)}" onchange="draftSet(${i},${j},'reps',this.value)"><span class="muted small">kg / reps</span><button onclick="removeSet(${i},${j})">×</button></div>`).join('')}<button class="ghost" onclick="addSet(${i})">＋ Ajouter une série</button></div>`}
function switchType(t){sessionDraft.type=t;render()}
function addExercise(){let name=$('#addex').value;if(!name)return;let e=store.plans.flatMap(p=>p.exercises).find(x=>x.name===name);sessionDraft.exercises.push({...e,setsData:Array.from({length:Number(e.sets)||3},()=>({weight:'',reps:''}))});render()}
function removeExercise(i){sessionDraft.exercises.splice(i,1);render()}
function draftSet(i,j,k,v){sessionDraft.exercises[i].setsData[j][k]=v}
function addSet(i){sessionDraft.exercises[i].setsData.push({weight:'',reps:''});render()}
function removeSet(i,j){sessionDraft.exercises[i].setsData.splice(j,1);render()}
function saveSession(){let s={date:new Date().toISOString(),type:sessionDraft.type,name:$('#sname').value,notes:$('#snotes').value};if(s.type==='running'){s.distance=$('#distance').value;s.duration=$('#duration').value;s.hr=$('#hr').value;s.elev=$('#elev').value;s.feel=$('#feel').value;if(!s.distance||!s.duration){toast('Renseigne distance et durée');return}}else{s.exercises=sessionDraft.exercises;if(!s.exercises.length){toast('Ajoute au moins un exercice');return}}store.sessions.push(s);save();sessionDraft=null;toast('Séance enregistrée');go('Progression')}
function progress(m){let strength=store.sessions.filter(s=>s.type==='strength'),runs=store.sessions.filter(s=>s.type==='running'),km=runs.reduce((a,s)=>a+(Number(s.distance)||0),0);m.innerHTML=`<div class="grid"><div class="card"><div class="label">Total séances</div><div class="metric">${store.sessions.length}</div></div><div class="card"><div class="label">Musculation</div><div class="metric">${strength.length}</div></div><div class="card"><div class="label">Running</div><div class="metric">${runs.length}</div></div><div class="card"><div class="label">Distance cumulée</div><div class="metric">${km.toFixed(1)} km</div></div></div>`+card('Historique des séances',store.sessions.length?store.sessions.slice().reverse().map(s=>`<div class="statline"><div><b>${esc(s.name)}</b><div class="muted small">${fmt(s.date)} · ${s.type==='running'?'Running':'Musculation'}</div></div><span class="chip">${s.type==='running'?esc(s.distance)+' km':(s.exercises||[]).length+' exercices'}</span></div>`).join(''):'<p class="muted">Tes séances apparaîtront ici après leur enregistrement.</p>')+card('Analyse automatique simple',`<p class="muted">Cette première version calcule les totaux à partir de tes séances enregistrées. L'analyse IA personnalisée sera branchée dans une version connectée, après validation des données.</p><div class="statline"><span>Distance running cumulée</span><b>${km.toFixed(1)} km</b></div><div class="statline"><span>Mesures corporelles</span><b>${store.body.length}</b></div>`)}
function dataPage(m){m.innerHTML=card('Sauvegarder tes données',`<p class="muted">Les données sont conservées localement dans ce navigateur. Exporte régulièrement un fichier JSON pour ne pas les perdre.</p><button class="btn" onclick="exportData()">Exporter ma sauvegarde</button><div class="field"><label>Importer une sauvegarde ATHLETIX (.json)</label><input id="restore" type="file" accept=".json,application/json" onchange="importData(event)"></div>`) + card('État des intégrations',`<div class="statline"><span>RENPHO / Google Health Connect</span><span class="chip">À connecter</span></div><div class="statline"><span>Fitbit Air / Health Connect</span><span class="chip">À connecter</span></div><div class="statline"><span>Compte cloud multi-appareils</span><span class="chip">À développer</span></div><p class="muted small">L'accès Health Connect nécessite une application Android native, des permissions explicites et des tests sur ton téléphone. Cette version web ne lit pas directement ces données.</p>`) + card('À propos',`<p>ATHLETIX V1 · Prototype autonome.</p><p class="muted small">Ce fichier ne transmet aucune donnée à un serveur. Les données restent dans le stockage local du navigateur. Pour une utilisation durable, exporte une sauvegarde.</p>`)}
function exportData(){let blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='athletix-sauvegarde.json';a.click();URL.revokeObjectURL(a.href)}
function importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.sessions||!d.body||!d.plans)throw Error();store=d;save();toast('Sauvegarde importée');render()}catch(e){toast('Fichier de sauvegarde invalide')}};r.readAsText(f)}
render();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service worker:', err)));
}
</script></body></html>
